
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BIGGEST TO SMALLEST — Feal.nun</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #fafafa;
  color: #171717;
  font-family: Arial, sans-serif;
}
header {
  padding: 20px 6%;
  border-bottom: 1px solid #e8e8e8;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.brand { font-weight: 900; font-size: 20px; }
header a { color: #555; text-decoration: none; }
main { max-width: 760px; margin: 45px auto; padding: 0 18px; }
h1 { font-size: clamp(30px, 6vw, 48px); margin: 0 0 10px; }
.subtitle { color: #666; line-height: 1.5; }
.stats {
  display: flex;
  gap: 12px;
  margin: 25px 0;
}
.stat {
  background: white;
  border: 1px solid #e8e8e8;
  border-radius: 13px;
  padding: 13px 17px;
  flex: 1;
}
.stat small { color: #777; display: block; margin-bottom: 5px; }
.stat strong { font-size: 22px; }
.instruction {
  background: #fff;
  border: 1px solid #e8e8e8;
  border-radius: 14px;
  padding: 17px;
  margin-bottom: 15px;
}
#items { display: grid; gap: 10px; }
.item {
  display: flex;
  align-items: center;
  gap: 14px;
  background: white;
  border: 1px solid #e4e4e4;
  border-radius: 13px;
  padding: 15px;
  min-height: 76px;
  transition: background .15s, border .15s;
}
.item.dragging { opacity: .45; }
.item.correct { border-color: #36a269; background: #f1fff6; }
.item.wrong { border-color: #d76b6b; background: #fff5f5; }
.handle {
  border: 0;
  background: #f1f1f1;
  border-radius: 9px;
  width: 38px;
  height: 38px;
  font-size: 20px;
  cursor: grab;
  touch-action: none;
  flex-shrink: 0;
}
.number {
  color: #999;
  font-weight: bold;
  width: 20px;
}
.name { font-weight: bold; }
.category { color: #777; font-size: 13px; margin-top: 5px; }
.size { color: #777; font-size: 12px; margin-left: auto; text-align: right; }
.actions { display: flex; gap: 10px; margin-top: 20px; }
button.action {
  border: 0;
  border-radius: 10px;
  padding: 14px 20px;
  font-weight: bold;
  font-size: 15px;
  cursor: pointer;
}
#check { background: #171717; color: white; flex: 1; }
#next { background: #e9e9e9; color: #171717; display: none; }
#message {
  margin-top: 18px;
  padding: 15px;
  border-radius: 12px;
  display: none;
  line-height: 1.5;
}
#message.show { display: block; }
footer { text-align: center; color: #999; font-size: 12px; margin: 45px 0 25px; }
@media (max-width: 500px) {
  main { margin-top: 30px; }
  .size { max-width: 95px; }
  .item { padding: 11px; gap: 9px; }
}
</style>
</head>
<body>
<header>
  <div class="brand">Feal.nun</div>
  <a href="./index.html">Back to games</a>
</header>

<main>
  <h1>BIGGEST TO SMALLEST</h1>
  <p class="subtitle">Can you put every living thing in the correct size order?</p>

  <div class="stats">
    <div class="stat"><small>ROUND</small><strong id="round">1</strong></div>
    <div class="stat"><small>SCORE</small><strong id="score">0</strong></div>
    <div class="stat"><small>BEST</small><strong id="best">0</strong></div>
  </div>

  <div class="instruction">
    <strong>How to play</strong>
    <p>Drag the cards into order, from the biggest living thing at the top to the smallest at the bottom. Then press Check Order.</p>
  </div>

  <div id="items"></div>

  <div class="actions">
    <button class="action" id="check">Check Order</button>
    <button class="action" id="next">Next Round</button>
  </div>

  <div id="message"></div>
</main>

<footer>Feal.nun — Explore the unusual.</footer>

<script>
const rounds = [
  [
    { name: "Giant sequoia", category: "Tree", size: 90, label: "Up to about 90 m tall" },
    { name: "Blue whale", category: "Animal", size: 30, label: "Up to about 30 m long" },
    { name: "Giant kelp", category: "Algae", size: 45, label: "Up to about 45 m long" },
    { name: "Giant squid", category: "Animal", size: 13, label: "Up to about 13 m long" },
    { name: "Human", category: "Animal", size: 2, label: "About 1–2 m tall" }
  ],
  [
    { name: "African elephant", category: "Animal", size: 4, label: "Up to about 4 m tall" },
    { name: "Ostrich", category: "Animal", size: 2.7, label: "Up to about 2.7 m tall" },
    { name: "Grey wolf", category: "Animal", size: 1.6, label: "Up to about 1.6 m long" },
    { name: "Domestic cat", category: "Animal", size: 0.46, label: "About 46 cm body length" },
    { name: "House mouse", category: "Animal", size: 0.1, label: "About 10 cm body length" }
  ],
  [
    { name: "Giant pumpkin", category: "Plant", size: 2.5, label: "Can grow over 2 m across" },
    { name: "Sunflower", category: "Plant", size: 3, label: "Some grow around 3 m tall" },
    { name: "Mushroom", category: "Fungus", size: 0.3, label: "A large cap can reach 30 cm" },
    { name: "Honey bee", category: "Animal", size: 0.015, label: "About 1.5 cm long" },
    { name: "Ant", category: "Animal", size: 0.005, label: "About 5 mm long" }
  ],
  [
    { name: "Amoeba", category: "Single-celled organism", size: 0.0005, label: "About 0.5 mm" },
    { name: "Tardigrade", category: "Microscopic animal", size: 0.0005, label: "Often around 0.5 mm" },
    { name: "Yeast cell", category: "Fungus", size: 0.00001, label: "About 10 micrometres" },
    { name: "E. coli bacterium", category: "Bacterium", size: 0.000002, label: "About 2 micrometres" },
    { name: "Mycoplasma", category: "Bacterium", size: 0.0000002, label: "About 0.2 micrometres" }
  ]
];

let roundIndex = 0;
let score = 0;
let best = Number(localStorage.getItem("fealnun_bts_best") || 0);
let currentItems = [];
let checked = false;

const list = document.getElementById("items");
const message = document.getElementById("message");
document.getElementById("best").textContent = best;

function shuffle(items) {
  const copy = [...items];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function renderRound() {
  checked = false;
  currentItems = shuffle(rounds[roundIndex]);
  document.getElementById("round").textContent = roundIndex + 1;
  document.getElementById("score").textContent = score;
  document.getElementById("check").style.display = "block";
  document.getElementById("next").style.display = "none";
  message.className = "";
  message.textContent = "";
  list.innerHTML = "";

  currentItems.forEach((item, index) => {
    const card = document.createElement("div");
    card.className = "item";
    card.dataset.name = item.name;
    card.innerHTML = `
      <span class="number">${index + 1}</span>
      <button class="handle" aria-label="Drag to move">☰</button>
      <div>
        <div class="name">${item.name}</div>
        <div class="category">${item.category}</div>
      </div>
      <div class="size">Unknown size</div>
    `;
    list.appendChild(card);
  });
  updateNumbers();
}

function updateNumbers() {
  [...list.children].forEach((card, index) => {
    card.querySelector(".number").textContent = index + 1;
  });
}

let dragged = null;

list.addEventListener("pointerdown", event => {
  const handle = event.target.closest(".handle");
  if (!handle || checked) return;
  dragged = handle.closest(".item");
  dragged.classList.add("dragging");
  event.preventDefault();
});

document.addEventListener("pointermove", event => {
  if (!dragged) return;
  const target = document.elementFromPoint(event.clientX, event.clientY);
  const over = target && target.closest(".item");
  if (!over || over === dragged || !list.contains(over)) return;

  const rect = over.getBoundingClientRect();
  const insertAfter = event.clientY > rect.top + rect.height / 2;
  list.insertBefore(dragged, insertAfter ? over.nextSibling : over);
  updateNumbers();
});

document.addEventListener("pointerup", () => {
  if (!dragged) return;
  dragged.classList.remove("dragging");
  dragged = null;
});

document.getElementById("check").addEventListener("click", () => {
  if (checked) return;
  checked = true;

  const correct = [...rounds[roundIndex]].sort((a, b) => b.size - a.size);
  const placed = [...list.children];
  let correctPositions = 0;

  placed.forEach((card, index) => {
    const isCorrect = card.dataset.name === correct[index].name;
    card.classList.add(isCorrect ? "correct" : "wrong");
    if (isCorrect) correctPositions++;
    card.querySelector(".size").textContent = correct[index].label;
  });

  const gained = correctPositions * 10;
  score += gained;
  document.getElementById("score").textContent = score;

  if (score > best) {
    best = score;
    localStorage.setItem("fealnun_bts_best", best);
    document.getElementById("best").textContent = best;
  }

  message.className = "show";
  message.innerHTML = `<strong>${correctPositions} out of 5 in the correct position.</strong><br>You earned ${gained} points. Green cards are in the right position.`;

  document.getElementById("check").style.display = "none";
  document.getElementById("next").style.display = "block";
  document.getElementById("next").textContent =
    roundIndex === rounds.length - 1 ? "Play Again" : "Next Round";
});

document.getElementById("next").addEventListener("click", () => {
  if (roundIndex === rounds.length - 1) {
    roundIndex = 0;
    score = 0;
  } else {
    roundIndex++;
  }
  renderRound();
});

renderRound();
</script>
</body>
</html>
