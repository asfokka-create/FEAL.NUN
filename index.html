<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feal.nun</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fafafa;color:#171717;font-family:Arial,sans-serif}
header{padding:25px 7%;border-bottom:1px solid #eee;font-size:23px;font-weight:900}
main{max-width:850px;margin:75px auto;padding:20px}
h1{font-size:52px;margin-bottom:10px}
p{color:#777;line-height:1.6}
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;margin-top:40px}
.game{display:block;background:white;border:1px solid #e8e8e8;border-radius:18px;padding:27px;color:#171717;text-decoration:none;transition:.2s}
.game:hover{transform:translateY(-5px);border-color:#aaa}
.number{font-size:12px;color:#999;font-weight:bold}
.game h2{margin-top:25px;font-size:24px}
.play{display:inline-block;margin-top:20px;font-weight:bold}
footer{text-align:center;color:#aaa;margin:70px 0 25px;font-size:12px}
</style>
</head>
<body>
<header>Feal.nun</header>
<main>
<h1>Explore the unusual.</h1>
<p>Small games. Big discoveries. Strange ideas.</p>
<div class="games">
<a class="game" href="./eggster.html">
<div class="number">GAME 01</div>
<h2>EGGSTER</h2>
<p>Click, explore and discover 48 hidden secrets.</p>
<span class="play">Play game →</span>
</a>
<a class="game" href="./biggest-to-smallest.html">
<div class="number">GAME 02</div>
<h2>BIGGEST TO SMALLEST</h2>
<p>Can you sort living things from biggest to smallest?</p>
<span class="play">Play game →</span>
</a>
</div>
</main>
<footer>Feal.nun — Made for curious minds.</footer>
</body>
</html>
